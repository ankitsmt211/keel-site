<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keel</title>
<meta name="description" content="A Chrome extension that saves the jobs you apply to. Everything stays on your device: no account, no tracking.">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  [hidden] { display: none !important; }
  :root { --bg: #F5F7FB; --text: #0F1B2D; --text-2: #26344D; --muted: #5B6880; --accent: #0F1B2D; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0D1424; --text: #F1F4FA; --text-2: #C9D2E3; --muted: #93A0B8; --accent: #DCE6FF; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  img { display: block; width: 72px; height: 72px; }
  h1 { font-size: 36px; line-height: 1.15; margin: 20px 0 8px; }
  p { color: var(--text-2); margin: 0 0 12px; }
  .note { color: var(--muted); font-size: 14px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="" width="72" height="72">
  <h1>Keel</h1>
  <p>A Chrome extension that saves the jobs you apply to: the company, the role, the job description and the résumé you sent. Everything stays on your device, with no account and no tracking.</p>
  <p class="note">Coming soon to the Chrome Web Store. <a href="privacy/">Privacy policy</a></p>
</main>
</body>
</html>
